<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1560" height="950" viewBox="0 0 1560 950" role="img" aria-label="LoRa PTMP topology"><title>LoRa PTMP topology</title><desc>Four ESP32-S3 meter nodes communicate with one ESP32-C3 gateway. The gateway exposes a local web dashboard.</desc><defs><style>.head{font:700 30px 'Segoe UI',Arial,sans-serif;fill:#fff}.sub{font:16px 'Segoe UI',Arial,sans-serif;fill:#e0f4ff}.sect{font:700 21px 'Segoe UI',Arial,sans-serif;fill:#184365}.label{font:700 17px 'Segoe UI',Arial,sans-serif;fill:#204c6b}.body{font:15px 'Segoe UI',Arial,sans-serif;fill:#56758a}.hint{font:14px 'Segoe UI',Arial,sans-serif;fill:#3d7397}.link:hover rect{stroke:#ffbe50;stroke-width:4}.link:hover text{fill:#007cb8}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#168bd1"/></marker></defs><rect width="1560" height="950" fill="#f3f7fb"/><rect width="1560" height="118" fill="#046ca9"/><rect x="32" y="20" width="194" height="74" rx="12" fill="#008dcc"/><g transform="translate(47 28) scale(.052)" fill="white"><path d="M1481 609v446h105V609zm-189-170h-108c-12 0-10 11-10 11 2 14 5 37 5 85 0 106-13 258-129 403l-8 10s-70-488-71-497c0 0 0-11-10-11H852c-10 0-10 11-10 11-3 56-34 526-377 602 73 8 161-15 238-62 95-59 159-146 180-246 0 0 42 262 47 322v4l-3 2c-96 51-205 79-314 79-270 0-509-160-614-404 62 287 318 496 617 496 349 0 557-292 593-500 0 0 47 303 48 313h143c-2-13-97-595-98-604 0 0 0-11-10-11zM83 694c0-320 270-580 601-580 205 0 396 103 507 270C1110 156 884 0 631 0 304 0 38 255 38 568c0 86 21 170 60 247-9-39-15-80-15-120zm2506-21c-38-44-91-67-155-67-65 0-120 21-164 63-43 41-65 96-65 164 0 67 21 121 63 161s103 60 179 60c148 0 180-102 192-135l-38-12c-34 62-110 66-155 63-32-2-61-13-84-29-23-17-39-41-46-78l-2-14h332c-1-73-20-132-57-175zm-267 113c-5 0-5-5-5-7 4-26 14-46 32-64 20-21 51-33 84-33 30 0 54 9 75 26 17 15 29 36 36 65 1 3 3 12-5 12h-217zm601-182c-126 0-171 77-185 113 0 1-5 13-5 13l42 14s27-78 134-73c108 4 95 93 95 107-60-18-145-16-201 9-70 32-81 96-78 143 3 70 65 119 145 123 72 4 104-12 134-41l-1 41h95V746c2-53-35-143-175-143zm80 346c0 7-2 12-8 15-18 9-56 21-103 18-49-4-68-39-71-54-1-6-12-71 51-91 41-13 93-5 121 3 8 2 10 7 10 17v93zM1579 439h-87c-13 0-11 13-11 13v94h107v-95s1-11-10-11zm534 0h-89c-9 0-9 10-9 10v183l-13-7c-14-7-28-12-43-15s-33-4-53-4c-70 0-127 20-169 61-41 40-63 98-63 169 0 63 18 116 53 158 35 41 86 62 153 62 96 0 134-58 134-58v56h108V949 450s0-11-9-11zm-104 494c-10 9-23 16-39 22-17 7-37 10-59 10-36 0-65-12-86-36s-31-59-31-106c0-46 10-80 29-101 20-22 50-33 90-33 21 0 41 3 59 10 16 6 28 12 37 20 3 3 6 8 6 15v183c0 7-3 12-6 15zM3163 365c-37 0-65 28-65 65 0 36 28 65 65 65s65-28 65-65c0-36-28-65-65-65zm0 9c31 0 55 25 55 56s-23 56-55 56c-31 0-55-25-55-56s23-56 55-56zm-14 60h16l21 33h11l-22-33c10-2 19-8 19-21s-7-21-24-21h-29v75h9v-33zm0-8v-26h17c9 0 18 2 18 13 0 13-11 13-22 13h-12z"/></g><text x="253" y="54" class="head">LoRa PTMP topology</text><text x="253" y="85" class="sub">Energy Station protocol v1 · up to 16 inventory entries, not 16 guaranteed simultaneous links</text><rect x="40" y="140" width="1460" height="50" rx="9" fill="#e2f1fb"/><text x="60" y="171" class="sect">One gateway · one shared radio frequency · multiple authenticated meter nodes</text><a class="link" href="../NODE_COMPATIBILITY.md"><rect x="51" y="210" width="425" height="122" rx="14" fill="#fff" stroke="#c1d7e6"/><rect x="51" y="210" width="10" height="122" rx="5" fill="#168bd1"/><text x="75" y="248" class="label">Node 2 · ESP32-S3</text><text x="75" y="279" class="body">Meter → RS485 / Modbus RTU</text><text x="75" y="308" class="hint">SX1262 · unique HMAC key · ID 2</text></a><path d="M476 271 C600 271,610 482,755 482" fill="none" stroke="#168bd1" stroke-width="3" marker-end="url(#arrow)"/><a class="link" href="../NODE_COMPATIBILITY.md"><rect x="51" y="367" width="425" height="122" rx="14" fill="#fff" stroke="#c1d7e6"/><rect x="51" y="367" width="10" height="122" rx="5" fill="#168bd1"/><text x="75" y="405" class="label">Node 3 · ESP32-S3</text><text x="75" y="436" class="body">Meter → RS485 / Modbus RTU</text><text x="75" y="465" class="hint">SX1262 · unique HMAC key · ID 3</text></a><path d="M476 428 C600 428,610 482,755 482" fill="none" stroke="#168bd1" stroke-width="3" marker-end="url(#arrow)"/><a class="link" href="../NODE_COMPATIBILITY.md"><rect x="51" y="524" width="425" height="122" rx="14" fill="#fff" stroke="#c1d7e6"/><rect x="51" y="524" width="10" height="122" rx="5" fill="#168bd1"/><text x="75" y="562" class="label">Node 4 · ESP32-S3</text><text x="75" y="593" class="body">Meter → RS485 / Modbus RTU</text><text x="75" y="622" class="hint">SX1262 · unique HMAC key · ID 4</text></a><path d="M476 585 C600 585,610 482,755 482" fill="none" stroke="#168bd1" stroke-width="3" marker-end="url(#arrow)"/><a class="link" href="../NODE_COMPATIBILITY.md"><rect x="51" y="681" width="425" height="122" rx="14" fill="#fff" stroke="#c1d7e6"/><rect x="51" y="681" width="10" height="122" rx="5" fill="#168bd1"/><text x="75" y="719" class="label">Node 5 · ESP32-S3</text><text x="75" y="750" class="body">Meter → RS485 / Modbus RTU</text><text x="75" y="779" class="hint">SX1262 · unique HMAC key · ID 5</text></a><path d="M476 742 C600 742,610 482,755 482" fill="none" stroke="#168bd1" stroke-width="3" marker-end="url(#arrow)"/><a class="link" href="../COLLISION_CONTROL.md"><rect x="755" y="338" width="450" height="288" rx="18" fill="#064b82" stroke="#2193cf"/><text x="782" y="382" style="font:bold 27px Arial;fill:white">ESP32-C3 GATEWAY</text><text x="782" y="414" style="font:16px Arial;fill:#dcefff">SX1262 · single RX/TX radio owner</text><text x="782" y="458" style="font:17px Arial;fill:white">HMAC + replay validation</text><text x="782" y="491" style="font:17px Arial;fill:white">ACK priority + TX budget</text><text x="782" y="524" style="font:17px Arial;fill:white">CAD before POLL</text><text x="782" y="557" style="font:17px Arial;fill:white">Deferred TX / bounded queues</text><text x="782" y="596" style="font:14px Arial;fill:#c9eafc">Open collision-control guide</text></a><path d="M1207 477H1278" stroke="#168bd1" stroke-width="4" marker-end="url(#arrow)"/><a class="link" href="../PLATFORMIO_VSCODE.md"><rect x="1279" y="368" width="235" height="230" rx="15" fill="#e9f5fc" stroke="#a7cde7"/><text x="1300" y="405" class="sect">LOCAL WEB</text><text x="1300" y="442" class="body">Wi-Fi / HTTP</text><text x="1300" y="477" class="body">Node inventory</text><text x="1300" y="512" class="body">Last valid kWh</text><text x="1300" y="547" class="body">Archive requests</text></a><rect x="532" y="713" width="980" height="139" rx="12" fill="#fff0df" stroke="#ecc89c"/><text x="554" y="748" class="label">Collision control is probabilistic, not TDMA</text><text x="554" y="780" class="body">RadioLib CAD reduces TX overlap with detectable channel activity.</text><text x="554" y="812" class="body">Two hidden nodes can still transmit simultaneously. Always run a site RF acceptance test.</text><text x="55" y="901" class="hint">Default PHY remains 915 MHz · BW 125 kHz · SF7 · CR4/5 · preamble 8 · 14 dBm configured TX · confirm legal RF use before deployment</text></svg>