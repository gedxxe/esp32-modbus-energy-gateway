<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="910" viewBox="0 0 1560 910" role="img" aria-labelledby="title desc">
<title id="title">Midea Engineering authenticated LoRa PTMP topology</title><desc id="desc">One SX1262 radio at an ESP32-C3 gateway receives from multiple ESP32-S3 RS485 power-meter nodes. Acknowledgements and POLLs share the same half-duplex channel; each node uses a unique identity and key. Browser connects over local Wi-Fi, not LoRa.</desc>
<defs><style>.head{font:700 31px Arial,sans-serif;fill:#0a578d}.node{font:700 17px Arial,sans-serif;fill:#14466b}.desc{font:15px Arial,sans-serif;fill:#597589}.small{font:13px Arial,sans-serif;fill:#688397}.section{font:700 18px Arial,sans-serif;fill:#204765}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#198acb"/></marker></defs>
<rect width="1560" height="910" fill="#f5f8fc"/>
<text x="58" y="73" class="head">Midea Engineering · LoRa PTMP power monitoring</text>
<text x="58" y="108" class="desc">Application protocol Energy Station v1 · One gateway / multiple nodes · HMAC-SHA256 authentication</text>
<rect x="55" y="135" width="455" height="49" rx="10" fill="#e6f2fc"/><text x="78" y="166" class="section">Meter acquisition nodes</text>
<g><rect x="56" y="216" width="420" height="125" rx="13" fill="white" stroke="#c9dbe9"/><rect x="56" y="216" width="9" height="125" rx="4" fill="#168bd2"/><text x="81" y="253" class="node">NODE 2 · ESP32-S3 + SX1262</text><text x="81" y="281" class="desc">Power meter → RS485 / Modbus RTU</text><text x="81" y="307" class="desc">Own Node ID + unique HMAC key</text></g>
<g><rect x="56" y="376" width="420" height="125" rx="13" fill="white" stroke="#c9dbe9"/><rect x="56" y="376" width="9" height="125" rx="4" fill="#168bd2"/><text x="81" y="413" class="node">NODE 3 · ESP32-S3 + SX1262</text><text x="81" y="441" class="desc">Power meter → RS485 / Modbus RTU</text><text x="81" y="467" class="desc">Own Node ID + unique HMAC key</text></g>
<g><rect x="56" y="536" width="420" height="125" rx="13" fill="white" stroke="#c9dbe9"/><rect x="56" y="536" width="9" height="125" rx="4" fill="#168bd2"/><text x="81" y="573" class="node">NODE 4 · ESP32-S3 + SX1262</text><text x="81" y="601" class="desc">Power meter → RS485 / Modbus RTU</text><text x="81" y="627" class="desc">Own Node ID + unique HMAC key</text></g>
<g><rect x="56" y="696" width="420" height="125" rx="13" fill="white" stroke="#c9dbe9"/><rect x="56" y="696" width="9" height="125" rx="4" fill="#168bd2"/><text x="81" y="733" class="node">NODE 5 · ESP32-S3 + SX1262</text><text x="81" y="761" class="desc">Power meter → RS485 / Modbus RTU</text><text x="81" y="787" class="desc">Own Node ID + unique HMAC key</text></g>
<path d="M476 278 C580 278 610 445 735 445" stroke="#198acb" stroke-width="3" fill="none" stroke-dasharray="none" marker-end="url(#arrow)"/>
<path d="M476 438 C580 438 610 445 735 445" stroke="#71a9d6" stroke-width="3" fill="none" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
<path d="M476 598 C580 598 610 445 735 445" stroke="#198acb" stroke-width="3" fill="none" stroke-dasharray="none" marker-end="url(#arrow)"/>
<path d="M476 758 C580 758 610 445 735 445" stroke="#71a9d6" stroke-width="3" fill="none" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
<rect x="733" y="326" width="408" height="245" rx="18" fill="#073e71"/><text x="766" y="377" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="white">ESP32-C3 gateway</text><text x="766" y="408" font-family="Arial,sans-serif" font-size="16" fill="#d0e8f8">SX1262 Ra-01SH V1.1</text><text x="766" y="449" font-family="Arial,sans-serif" font-size="16" fill="#d0e8f8">One half-duplex LoRa channel</text><text x="766" y="481" font-family="Arial,sans-serif" font-size="16" fill="#d0e8f8">ACK priority · CAD before POLL</text><text x="766" y="513" font-family="Arial,sans-serif" font-size="16" fill="#d0e8f8">Replay, HMAC, checkpoint storage</text>
<path d="M1143 446 H1252" stroke="#1587c9" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="1252" y="350" width="255" height="190" rx="15" fill="#e8f3fd" stroke="#94c0e1"/><text x="1274" y="391" class="section">Local web dashboard</text><text x="1274" y="423" class="desc">Wi-Fi AP · HTTP API</text><text x="1274" y="455" class="desc">Last valid kWh</text><text x="1274" y="483" class="desc">Age / RSSI / SNR</text><text x="1274" y="511" class="desc">Manual Request live</text>
<text x="544" y="239" class="small">Periodic TELEMETRY → gateway</text><text x="544" y="263" class="small">← ACK (prioritized)</text><text x="544" y="286" class="small">← POLL (read request)</text>
<rect x="706" y="605" width="785" height="175" rx="15" fill="#fff" stroke="#bed6e9"/><text x="733" y="647" class="section">PTMP is not collision-free TDMA</text>
<text x="733" y="681" class="desc">Different Node IDs identify senders; they do not reserve separate radio slots.</text>
<text x="733" y="712" class="desc">Randomized node backoff + gateway CAD/backoff reduce overlaps.</text>
<text x="733" y="743" class="desc">Hidden nodes, interference and two simultaneous uplinks can still collide.</text>
<text x="58" y="861" class="small">Default example PHY: 915 MHz, BW125, SF7, CR4/5, preamble 8, sync 0x12 · Check legal band, power, antenna and site RF survey before deployment.</text>
</svg>