<svg xmlns="http://www.w3.org/2000/svg" width="1530" height="905" viewBox="0 0 1530 905" role="img" aria-label="Collision-aware medium access"><title>Collision-aware medium access</title><desc>Nonblocking SX1262 CAD detects LoRa channel activity, defers without changing packet sequence and reserves gateway ACK priority.</desc><defs><style>.head{font:700 31px Arial,sans-serif;fill:white}.sub{font:16px Arial,sans-serif;fill:#e1f4ff}.label{font:700 22px Arial,sans-serif;fill:#194767}.copy{font:16px Arial,sans-serif;fill:#54758d}.mini{font:14px Arial,sans-serif;fill:#5f7d93}.link:hover rect{stroke:#ffb24c;stroke-width:4}</style><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#1387c7"/></marker></defs><rect width="1530" height="905" fill="#f4f8fb"/><rect width="1530" height="118" fill="#046ca9"/><rect x="28" y="20" width="203" height="75" rx="12" fill="#008dcc"/><g transform="translate(45 28) scale(.052)" fill="white"><path d="M1481 609v446h105V609zm-189-170h-108c-12 0-10 11-10 11 2 14 5 37 5 85 0 106-13 258-129 403l-8 10s-70-488-71-497c0 0 0-11-10-11H852c-10 0-10 11-10 11-3 56-34 526-377 602 73 8 161-15 238-62 95-59 159-146 180-246 0 0 42 262 47 322v4l-3 2c-96 51-205 79-314 79-270 0-509-160-614-404 62 287 318 496 617 496 349 0 557-292 593-500 0 0 47 303 48 313h143c-2-13-97-595-98-604 0 0 0-11-10-11zM83 694c0-320 270-580 601-580 205 0 396 103 507 270C1110 156 884 0 631 0 304 0 38 255 38 568c0 86 21 170 60 247-9-39-15-80-15-120zm2506-21c-38-44-91-67-155-67-65 0-120 21-164 63-43 41-65 96-65 164 0 67 21 121 63 161s103 60 179 60c148 0 180-102 192-135l-38-12c-34 62-110 66-155 63-32-2-61-13-84-29-23-17-39-41-46-78l-2-14h332c-1-73-20-132-57-175zm-267 113c-5 0-5-5-5-7 4-26 14-46 32-64 20-21 51-33 84-33 30 0 54 9 75 26 17 15 29 36 36 65 1 3 3 12-5 12h-217zm601-182c-126 0-171 77-185 113 0 1-5 13-5 13l42 14s27-78 134-73c108 4 95 93 95 107-60-18-145-16-201 9-70 32-81 96-78 143 3 70 65 119 145 123 72 4 104-12 134-41l-1 41h95V746c2-53-35-143-175-143zm80 346c0 7-2 12-8 15-18 9-56 21-103 18-49-4-68-39-71-54-1-6-12-71 51-91 41-13 93-5 121 3 8 2 10 7 10 17v93zM1579 439h-87c-13 0-11 13-11 13v94h107v-95s1-11-10-11zm534 0h-89c-9 0-9 10-9 10v183l-13-7c-14-7-28-12-43-15s-33-4-53-4c-70 0-127 20-169 61-41 40-63 98-63 169 0 63 18 116 53 158 35 41 86 62 153 62 96 0 134-58 134-58v56h108V949 450s0-11-9-11zm-104 494c-10 9-23 16-39 22-17 7-37 10-59 10-36 0-65-12-86-36s-31-59-31-106c0-46 10-80 29-101 20-22 50-33 90-33 21 0 41 3 59 10 16 6 28 12 37 20 3 3 6 8 6 15v183c0 7-3 12-6 15zM3163 365c-37 0-65 28-65 65 0 36 28 65 65 65s65-28 65-65c0-36-28-65-65-65zm0 9c31 0 55 25 55 56s-23 56-55 56c-31 0-55-25-55-56s23-56 55-56zm-14 60h16l21 33h11l-22-33c10-2 19-8 19-21s-7-21-24-21h-29v75h9v-33zm0-8v-26h17c9 0 18 2 18 13 0 13-11 13-22 13h-12z"/></g><text x="256" y="52" class="head">Collision-aware medium access</text><text x="256" y="86" class="sub">Node and gateway share one radio and an immutable LoRa v1 packet contract</text><rect x="45" y="202" width="340" height="112" rx="14" fill="#e3f2fc" stroke="#bbd6e5"/><text x="64" y="245" class="label">Pending TX</text><text x="64" y="278" class="copy">Node HELLO / telemetry</text><rect x="45" y="380" width="340" height="112" rx="14" fill="#e8f5ea" stroke="#bbd6e5"/><text x="64" y="423" class="label">Gateway ACK</text><text x="64" y="456" class="copy">Priority · no CAD</text><rect x="460" y="202" width="340" height="112" rx="14" fill="#e3f2fc" stroke="#bbd6e5"/><text x="479" y="245" class="label">Channel sensing</text><text x="479" y="278" class="copy">SX1262 CAD · nonblocking</text><rect x="874" y="202" width="340" height="112" rx="14" fill="#e8f5ea" stroke="#bbd6e5"/><text x="893" y="245" class="label">Channel free</text><text x="893" y="278" class="copy">Transmit unchanged frame</text><rect x="874" y="399" width="340" height="112" rx="14" fill="#fff0de" stroke="#bbd6e5"/><text x="893" y="442" class="label">Channel busy</text><text x="893" y="475" class="copy">Exponential random backoff</text><rect x="874" y="587" width="340" height="112" rx="14" fill="#fce6e4" stroke="#bbd6e5"/><text x="893" y="630" class="label">Recovery</text><text x="893" y="663" class="copy">CAD timeout / SPI error</text><rect x="1270" y="202" width="220" height="112" rx="14" fill="#e5f1fb" stroke="#bbd6e5"/><text x="1289" y="245" class="label">Receive ACK</text><text x="1289" y="278" class="copy">Validate HMAC / seq</text><path d="M385 254H460M800 254H874M1214 254H1270" stroke="#1485c8" stroke-width="4" marker-end="url(#arr)"/><path d="M640 314V450H874" stroke="#d3944d" fill="none" stroke-width="4" marker-end="url(#arr)"/><path d="M1070 509V565" stroke="#d3944d" stroke-width="4" marker-end="url(#arr)"/><path d="M875 450H678V350" fill="none" stroke="#d3944d" stroke-width="3" stroke-dasharray="6 8" marker-end="url(#arr)"/><path d="M385 433H1230V254H1270" fill="none" stroke="#178b7d" stroke-width="3" marker-end="url(#arr)"/><a class="link" href="../COLLISION_CONTROL.md"><rect x="44" y="742" width="1447" height="112" rx="12" fill="#e6f2fb" stroke="#b2d2e6"/><text x="67" y="781" class="label">CAD + backoff ≠ TDMA</text><text x="67" y="813" class="copy">Each radio owns RX / CAD / TX exclusively. Busy-channel deferral preserves original session and sequence.</text><text x="67" y="839" class="copy">Hidden node TX overlap and environmental RF interference can still occur. See RF acceptance tests →</text></a></svg>