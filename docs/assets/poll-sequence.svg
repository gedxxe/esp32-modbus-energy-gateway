6 36 65 1 3 3 12-5 12h-217zm601-182c-126 0-171 77-185 113 0 1-5 13-5 13l42 14s27-78 134-73c108 4 95 93 95 107-60-18-145-16-201 9-70 32-81 96-78 143 3 70 65 119 145 123 72 4 104-12 134-41l-1 41h95V746c2-53-35-143-175-143zm80 346c0 7-2 12-8 15-18 9-56 21-103 18-49-4-68-39-71-54-1-6-12-71 51-91 41-13 93-5 121 3 8 2 10 7 10 17v93zM1579 439h-87c-13 0-11 13-11 13v94h107v-95s1-11-10-11zm534 0h-89c-9 0-9 10-9 10v183l-13-7c-14-7-28-12-43-15s-33-4-53-4c-70 0-127 20-169 61-41 40-63 98-63 169 0 63 18 116 53 158 35 41 86 62 153 62 96 0 134-58 134-58v56h108V949 450s0-11-9-11zm-104 494c-10 9-23 16-39 22-17 7-37 10-59 10-36 0-65-12-86-36s-31-59-31-106c0-46 10-80 29-101 20-22 50-33 90-33 21 0 41 3 59 10 16 6 28 12 37 20 3 3 6 8 6 15v183c0 7-3 12-6 15zM3163 365c-37 0-65 28-65 65 0 36 28 65 65 65s65-28 65-65c0-36-28-65-65-65zm0 9c31 0 55 25 55 56s-23 56-55 56c-31 0-55-25-55-56s23-56 55-56zm-14 60h16l21 33h11l-22-33c10-2 19-8 19-21s-7-21-24-21h-29v75h9v-33zm0-8v-26h17c9 0 18 2 18 13 0 13-11 13-22 13h-12z"/></g><text x="253" y="54" class="head">Authenticated request / response</text><text x="253" y="85" class="sub">Gateway POLL and telemetry preserve per-node session, sequence and provenance</text><rect x="50" y="164" width="285" height="62" rx="9" fill="#e8f2fa"/><text x="68" y="200" style="font:bold 18px Arial;fill:#225374">METER / RS485</text><path d="M192 226V804" stroke="#b5cfdf" stroke-width="2" stroke-dasharray="7 8"/><rect x="420" y="164" width="285" height="62" rx="9" fill="#e8f2fa"/><text x="438" y="200" style="font:bold 18px Arial;fill:#225374">ESP32-S3 NODE</text><path d="M562 226V804" stroke="#b5cfdf" stroke-width="2" stroke-dasharray="7 8"/><rect x="812" y="164" width="285" height="62" rx="9" fill="#085489"/><text x="830" y="200" style="font:bold 18px Arial;fill:white">ESP32-C3 GATEWAY</text><path d="M954 226V804" stroke="#b5cfdf" stroke-width="2" stroke-dasharray="7 8"/><rect x="1210" y="164" width="285" height="62" rx="9" fill="#e8f2fa"/><text x="1228" y="200" style="font:bold 18px Arial;fill:#225374">BROWSER</text><path d="M1352 226V804" stroke="#b5cfdf" stroke-width="2" stroke-dasharray="7 8"/><line x1="192" y1="290" x2="563" y2="290" stroke="#169982" stroke-width="3" marker-end="url(#arrow)"/><text x="204" y="275" class="body">FC03 meter reads happen on node schedule</text><line x1="563" y1="350" x2="953" y2="350" stroke="#168bd1" stroke-width="3" marker-end="url(#arrow)"/><text x="575" y="335" class="body">Autonomous TELEMETRY (signed HMAC)</text><line x1="953" y1="393" x2="563" y2="393" stroke="#168bd1" stroke-width="3" marker-end="url(#arrow)"/><text x="575" y="378" class="body">Addressed ACK priority</text><line x1="1353" y1="452" x2="953" y2="452" stroke="#168bd1" stroke-width="3" marker-end="url(#arrow)"/><text x="965" y="437" class="body">Request live via HTTP</text><a class="link" href="../COLLISION_CONTROL.md"><rect x="850" y="475" width="400" height="104" rx="13" fill="#e4f3eb" stroke="#a2d7b9"/><text x="870" y="508" class="label">Reserve POLL sequence in NVS</text><text x="870" y="539" class="body">CAD → clear = TX; busy = backoff</text><text x="870" y="563" class="hint">Do not allocate a new seq while deferred</text></a><line x1="953" y1="623" x2="563" y2="623" stroke="#168bd1" stroke-width="3" marker-end="url(#arrow)"/><text x="575" y="608" class="body">Authenticated POLL (mode 0)</text><line x1="563" y1="691" x2="953" y2="691" stroke="#168bd1" stroke-width="3" marker-end="url(#arrow)"/><text x="575" y="676" class="body">TELEMETRY with correlated sequence</text><line x1="953" y1="757" x2="563" y2="757" stroke="#168bd1" stroke-width="3" marker-end="url(#arrow)"/><text x="575" y="742" class="body">ACK after validation</text><a class="link" href="../NODE_COMPATIBILITY.md"><rect x="1224" y="637" width="291" height="159" rx="12" fill="#e7f3fc" stroke="#b5d5e8"/><text x="1246" y="672" class="label">Result states</text><text x="1246" y="705" class="body">accepted ≠ fresh meter</text><text x="1246" y="735" class="body">stale retains last kWh</text><text x="1246" y="767" class="body">timeout is not zero</text></a><text x="47" y="881" class="hint">POLL returns the node's last available sample. Protocol v1 does not force a fresh Modbus transaction. CAD does not create collision-free time slots.</text></svg>