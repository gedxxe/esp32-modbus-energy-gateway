<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="930" viewBox="0 0 1550 930" role="img" aria-labelledby="title desc">
<title id="title">LoRa POLL and TELEMETRY request sequence</title><desc id="desc">The node obtains an energy reading through Modbus on its own acquisition schedule. The operator clicks Request live; gateway reserves a downlink sequence, senses the channel with CAD, sends an authenticated POLL; node replies with the latest published telemetry, not a forced new Modbus register read. The gateway validates and ACKs it. If the channel is busy it backs off without changing the sequence.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#1685c7"/></marker></defs>
<rect width="1550" height="930" fill="#f6f9fc"/>
<text x="52" y="65" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#075b9c">LoRa request/response · Energy Station v1</text>
<text x="52" y="107" font-family="Arial,sans-serif" font-size="18" fill="#50748e">POLL requests the node's latest published data; it does not trigger a new Modbus transaction.</text>
<rect x="56" y="180" width="255" height="66" rx="12" fill="#e9f3fc"/><text x="73" y="219" fill="#12496d" font-family="Arial,sans-serif" font-size="19" font-weight="700">POWER METER</text><path d="M184 247V772" stroke="#c5d8e8" stroke-width="2" stroke-dasharray="6 8"/><rect x="423" y="180" width="255" height="66" rx="12" fill="#e9f3fc"/><text x="440" y="219" fill="#12496d" font-family="Arial,sans-serif" font-size="19" font-weight="700">ESP32-S3 NODE</text><path d="M551 247V772" stroke="#c5d8e8" stroke-width="2" stroke-dasharray="6 8"/><rect x="809" y="180" width="255" height="66" rx="12" fill="#07559a"/><text x="826" y="219" fill="white" font-family="Arial,sans-serif" font-size="19" font-weight="700">ESP32-C3 GATEWAY</text><path d="M937 247V772" stroke="#c5d8e8" stroke-width="2" stroke-dasharray="6 8"/><rect x="1190" y="180" width="255" height="66" rx="12" fill="#e9f3fc"/><text x="1207" y="219" fill="#12496d" font-family="Arial,sans-serif" font-size="19" font-weight="700">LOCAL DASHBOARD</text><path d="M1318 247V772" stroke="#c5d8e8" stroke-width="2" stroke-dasharray="6 8"/>
<path d="M184 292 H551" stroke="#43a58e" stroke-width="3" marker-end="url(#arrow)"/><text x="202" y="279" font-family="Arial,sans-serif" font-size="15" fill="#245477">Scheduled Modbus read (FC03)</text>
<path d="M551 356 H937" stroke="#197fbd" stroke-width="3" marker-end="url(#arrow)"/><text x="569" y="343" font-family="Arial,sans-serif" font-size="15" fill="#245477">Periodic TELEMETRY + HMAC</text>
<path d="M937 401 H551" stroke="#197fbd" stroke-width="3" marker-end="url(#arrow)"/><text x="569" y="388" font-family="Arial,sans-serif" font-size="15" fill="#245477">ACK (same session / sequence)</text>
<path d="M1318 468 H937" stroke="#197fbd" stroke-width="3" marker-end="url(#arrow)"/><text x="955" y="455" font-family="Arial,sans-serif" font-size="15" fill="#245477">HTTP POST /api/command</text>
<rect x="843" y="483" width="410" height="77" rx="9" fill="#eaf5ec" stroke="#9dd0a9"/><text x="858" y="511" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#256046">Reserve unique downlink sequence</text><text x="858" y="538" font-family="Arial,sans-serif" font-size="14" fill="#44795c">ACK queue priority; nonblocking SX1262 CAD for POLL</text>
<path d="M936 560v31" stroke="#46a17f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="845" y="594" width="407" height="57" rx="10" fill="#fff4e9" stroke="#efc08b"/><text x="857" y="618" font-family="Arial,sans-serif" font-size="16" fill="#995719">If CAD sees activity: random backoff</text><text x="857" y="639" font-family="Arial,sans-serif" font-size="13" fill="#995719">Requeue unchanged POLL sequence; resume RX</text>
<path d="M938 685 H550" stroke="#197fbd" stroke-width="3" marker-end="url(#arrow)"/><text x="568" y="672" font-family="Arial,sans-serif" font-size="15" fill="#245477">POLL mode 0, HMAC authenticated</text>
<path d="M552 742 H938" stroke="#197fbd" stroke-width="3" marker-end="url(#arrow)"/><text x="570" y="729" font-family="Arial,sans-serif" font-size="15" fill="#245477">TELEMETRY with POLL correlation</text>
<path d="M939 788 H552" stroke="#197fbd" stroke-width="3" marker-end="url(#arrow)"/><text x="570" y="775" font-family="Arial,sans-serif" font-size="15" fill="#245477">ACK after validation</text>
<rect x="1144" y="689" width="350" height="137" rx="10" fill="#e5f0fc" stroke="#b3cfe7"/><text x="1164" y="723" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#145c90">Browser status update</text><text x="1164" y="756" font-family="Arial,sans-serif" font-size="14" fill="#476d8c">Valid kWh: update last-valid value</text><text x="1164" y="780" font-family="Arial,sans-serif" font-size="14" fill="#476d8c">Invalid/stale: keep previous kWh + age</text><text x="1164" y="804" font-family="Arial,sans-serif" font-size="14" fill="#476d8c">No response: report timeout</text>
<text x="52" y="886" font-family="Arial,sans-serif" font-size="14" fill="#697f91">Important: LoRa uses a single half-duplex channel. CAD mitigates only gateway-originated transmissions; collisions between autonomous nodes remain possible.</text>
</svg>