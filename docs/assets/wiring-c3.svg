<g><rect x="76" y="613" width="304" height="42" rx="8" fill="#fff"/><rect x="1010" y="613" width="354" height="42" rx="8" fill="#fff"/><path d="M382 634 H1008" fill="none" stroke="#6b7b8b" stroke-width="3" stroke-linecap="round"/><circle cx="382" cy="634" r="5" fill="#6b7b8b"/><circle cx="1008" cy="634" r="5" fill="#6b7b8b"/><text x="100" y="639" class="pin">GND</text><text x="265" y="639" class="signal">GND</text><text x="1030" y="639" class="pin">PAD 2 · 9 · 16</text><text x="1173" y="639" class="detail">All module grounds</text></g>
<rect x="76" y="675" width="1288" height="105" rx="12" fill="#eff6fc" stroke="#d4e4f3"/>
<text x="100" y="702" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#14548a">Power &amp; RF checks before transmitting</text>
<text x="100" y="729" class="detail">Antenna → radio ANT pad 1 / fitted IPEX, matched 50 Ω. Place 100 nF + 10 µF decoupling close to 3.3 V radio supply.</text>
<text x="100" y="754" class="detail">Radio branch ≥200 mA; common GND on pads 2, 9, 16. Crystal module: TCXO = 0 V, DIO2 RF switch managed inside radio.</text>
<text x="75" y="803" class="sub">Do not wire TXEN / RXEN / DIO2 / DIO3 pads for this confirmed V1.1 circuit. Always verify purchased board, module and antenna physically.</text>
</svg>