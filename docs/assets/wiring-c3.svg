<text x="75" y="128" font-family="Arial,sans-serif" font-size="22" fill="#334e67">Gateway reference wiring · ESP32-C3 → SX1262</text>
<text x="75" y="155" class="sub">Software board: esp32-c3-devkitm-1 · Radio: Ai-Thinker Ra-01SH V1.1 · Pin names are GPIO labels, NOT physical header numbering</text>
