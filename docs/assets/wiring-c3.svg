<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
<title id="title">Midea Engineering ESP32-C3 DevKitM-1 to SX1262 Ra-01SH V1.1 wiring</title>
<desc id="desc">Logical SPI and GPIO netlist, showing GPIO4 SCK to pad12, GPIO6 MOSI pad14, GPIO5 MISO pad13, GPIO7 NSS pad15, GPIO10 reset pad4, GPIO3 busy pad10, GPIO1 DIO1 pad6, 3.3V pad3, common ground pads2,9,16. Antenna connects to pad1.</desc>
<defs><style>.pin{font:700 18px Arial,sans-serif;fill:#133957}.signal{font:600 15px Arial,sans-serif;fill:#63778b}.detail{font:14px Arial,sans-serif;fill:#63778b}.sub{font:14px Arial,sans-serif;fill:#698099}.heading{font:700 23px Arial,sans-serif;fill:#16395b}</style></defs>
