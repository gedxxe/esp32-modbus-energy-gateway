<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="870" viewBox="0 0 1500 870" role="img" aria-labelledby="title desc">
<title id="title">ESP32-C3 gateway PlatformIO VS Code project layout</title><desc id="desc">Open the gateway repository root in VS Code. PlatformIO reads root platformio.ini and builds src_dir firmware with board esp32-c3-devkitm-1. Source modules are separated into radio, core, app, storage and web. Dashboard React source generates firmware/web/assets.h before firmware build. ESP32-S3 node is a separate read-only project.</desc>
<defs><marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#1684c5"/></marker></defs><rect width="1500" height="870" fill="#f5f8fc"/><text x="65" y="72" font-family="Arial,sans-serif" font-size="33" font-weight="700" fill="#075a99">PlatformIO + Visual Studio Code</text><text x="65" y="110" font-family="Arial,sans-serif" font-size="18" fill="#50718b">ESP32-C3 gateway build (separate from the ESP32-S3 meter node project)</text>
<rect x="65" y="144" width="645" height="622" rx="19" fill="white" stroke="#c5d9eb"/><text x="90" y="188" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#134d7c">Open repository ROOT as a VS Code folder</text><rect x="90" y="231" width="590" height="76" rx="12" fill="#e5f1fc" stroke="#c9dae9"/><text x="110" y="260" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#154d77">platformio.ini</text><text x="110" y="286" font-family="Arial,sans-serif" font-size="16" fill="#56778f">[env:esp32c3] · pinned toolchain</text><rect x="90" y="326" width="590" height="76" rx="12" fill="#fff" stroke="#c9dae9"/><text x="110" y="355" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#154d77">firmware/main.cpp</text><text x="110" y="381" font-family="Arial,sans-serif" font-size="16" fill="#56778f">setup() / loop()</text><rect x="90" y="421" width="590" height="76" rx="12" fill="#fff" stroke="#c9dae9"/><text x="110" y="450" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#154d77">firmware/radio/ + board/</text><text x="110" y="476" font-family="Arial,sans-serif" font-size="16" fill="#56778f">SPI owner · SX1262 · GPIO wiring</text><rect x="90" y="516" width="590" height="76" rx="12" fill="#fff" stroke="#c9dae9"/><text x="110" y="545" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#154d77">firmware/core/</text><text x="110" y="571" font-family="Arial,sans-serif" font-size="16" fill="#56778f">Codec · HMAC · radio scheduler · CAD policy</text><rect x="90" y="611" width="590" height="76" rx="12" fill="#fff" stroke="#c9dae9"/><text x="110" y="640" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#154d77">firmware/app/ + storage/ + web/</text><text x="110" y="666" font-family="Arial,sans-serif" font-size="16" fill="#56778f">Queues · snapshots · flash · HTTP API</text>
<rect x="772" y="182" width="670" height="145" rx="15" fill="#e7f2fc" stroke="#bad6ed"/><text x="798" y="223" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#135784">dashboard/ (React)</text><text x="798" y="256" font-family="Arial,sans-serif" font-size="17" fill="#446b8a">npm ci → npm run build → npm test</text><text x="798" y="291" font-family="Arial,sans-serif" font-size="16" fill="#446b8a">Generated asset: firmware/web/assets.h</text>
