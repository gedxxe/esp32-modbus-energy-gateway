name: Gateway PlatformIO and PTMP validation

on:
  push:
    branches:
      - main
      - audit/platformio-ptmp-c3-20261105
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-and-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repository privacy and historical report
        run: python tools/security_audit.py --history
      - name: Upstream package and LoRa wire compatibility (read-only baseline)
        run: python tools/check_compatibility.py
      - name: ESP32-C3 GPIO and wiring-diagram integrity
        run: python tools/check_wiring.py
      - name: Native radio, scheduler and persistence regression
        run: python tools/test_native.py
      - name: Build offline dashboard and run DOM tests
        working-directory: dashboard
        run: |
          npm ci
          npm run build
          npm test
      - name: Require checked-in embedded dashboard to match React source
        run: git diff --exit-code -- firmware/web/assets.h
      - name: Install pinned PlatformIO Core
        run: python -m pip install platformio==6.1.19
      - name: Build reference ESP32-C3 firmware with pinned pioarduino
        run: python -m platformio run -e esp32c3
