name: Gateway validation
on:
  push:
    branches:
      - main
      - refactor/midea-gateway-lora-sync-20261105
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  source-and-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan tracked source and documentation
        run: python tools/security_audit.py --history
      - name: Compile and test portable gateway core
        run: python tools/test_native.py
      - name: Bundle offline dashboard and run browser tests
        working-directory: dashboard
        run: |
          npm ci
          npm run build
          npm test
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Build ESP32-C3 gateway
        run: python -m platformio run -e esp32c3
      - name: Commit generated dashboard assets to the gateway branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/midea-gateway-lora-sync-20261105'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/web/assets.h
          if ! git diff --cached --quiet; then
            git commit -m "build: update bundled gateway dashboard assets"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
