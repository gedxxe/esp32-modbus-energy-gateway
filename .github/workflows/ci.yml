name: Gateway PlatformIO and PTMP validation

on:
  push:
    branches:
      - main
      - refactor/platformio-layout-ptmp-20261105
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-and-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out pinned ESP32-S3 peer source (read-only)
        uses: actions/checkout@v4
        with:
          repository: gedxxe/esp32-modbus-energy
          ref: 737cfff590c0cbea33895df17c3e3ffc06449e15
          path: .peer
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repository privacy and historical report
        run: python tools/security_audit.py --history
      - name: Upstream package and LoRa wire compatibility (read-only baseline)
        run: python tools/check_compatibility.py --node-platformio .peer/firmware/platformio.ini
      - name: ESP32-C3 GPIO and wiring-diagram integrity
        run: python tools/check_wiring.py
      - name: Standard PlatformIO folder and include resolution
        run: python tools/check_layout.py
      - name: Compile actual node and gateway wire contract together
        run: python tools/test_peer_wire.py .peer
      - name: Native radio, scheduler and persistence regression
        run: python tools/test_native.py
      - name: Build offline dashboard and run DOM tests
        working-directory: dashboard
        run: |
          npm ci
          npm run build
          npm test
      - name: Require checked-in embedded dashboard to match React source
        run: git diff --exit-code -- firmware/include/web/assets.h
      - name: Install pinned PlatformIO Core
        run: python -m pip install platformio==6.1.19
      - name: Build reference ESP32-C3 firmware with pinned pioarduino
        run: python -m platformio run --project-dir firmware -e esp32c3
      - name: Generate first-provisioning filesystem image without uploading
        run: python -m platformio run --project-dir firmware -e esp32c3 -t buildfs
      - name: Verify flash layout, reserved sequence ledger and archive offsets
        run: python tools/check_flash_layout.py
      - name: Create and verify a source + safe flash-image release
        run: |
          python tools/package.py
          python tools/package.py --verify
      - name: Publish audited gateway release as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gateway-esp32c3-audit
          path: |
            release/*.zip
            release/manifest.json
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
