name: Gateway PlatformIO and PTMP validation

on:
  push:
    branches:
      - main
      - refactor/platformio-layout-ptmp-20261105
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Check Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Reject whitespace errors in changed sources
        run: git diff --check HEAD^ HEAD
      - name: Python tooling syntax and repository hygiene
        run: |
          python -m compileall -q tools
          python tools/check_layout.py
          python tools/security_audit.py
          python tools/check_compatibility.py
      - name: C++ core runtime quality gate (UBSan, assertions, HMAC vectors)
        run: python tools/test_native.py --sanitizers

  source-and-firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out audited current ESP32-S3 main (read-only)
        uses: actions/checkout@v7
        with:
          repository: gedxxe/esp32-modbus-energy
          ref: a0e48ba9c1756e655318168d01ffaed10c151ec7
          path: .peer
          persist-credentials: false
      - name: Check out legacy LoRa v1 baseline (read-only)
        uses: actions/checkout@v7
        with:
          repository: gedxxe/esp32-modbus-energy
          ref: 737cfff590c0cbea33895df17c3e3ffc06449e15
          path: .peer-legacy
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Repository privacy and historical report
        run: python tools/security_audit.py --history
      - name: Current node package and LoRa wire compatibility (read-only)
        run: python tools/check_compatibility.py --node-platformio .peer/firmware/platformio.ini
      - name: ESP32-C3 GPIO and wiring-diagram integrity
        run: python tools/check_wiring.py
      - name: Standard PlatformIO folder and include resolution
        run: python tools/check_layout.py
      - name: Compile production gateway wire codec against current node main
        run: python tools/test_peer_wire.py .peer
      - name: Compile current client meter profiles against gateway contract
        run: python tools/test_client_profiles.py .peer
      - name: Verify legacy v1 node package compatibility
        run: python tools/check_compatibility.py --node-platformio .peer-legacy/firmware/platformio.ini
      - name: Compile production LoRa codec against legacy node revision
        run: python tools/test_peer_wire.py .peer-legacy
      - name: Native radio, scheduler and persistence regression
        run: python tools/test_native.py
      - name: Build offline dashboard and run DOM tests
        working-directory: dashboard
        run: |
          npm ci
          npm run build
          npm test
      - name: Require checked-in embedded dashboard to match React source
        run: git diff --exit-code -- firmware/include/web/assets.h
      - name: Install pinned PlatformIO Core
        run: python -m pip install platformio==6.1.19
      - name: Build reference ESP32-C3 firmware with pinned pioarduino
        run: python -m platformio run --project-dir firmware -e esp32c3
      - name: Generate first-provisioning filesystem image without uploading
        run: python -m platformio run --project-dir firmware -e esp32c3 -t buildfs
      - name: Verify flash layout, reserved sequence ledger and archive offsets
        run: python tools/check_flash_layout.py
      - name: Create and verify a source + safe flash-image release
        run: |
          python tools/package.py
          python tools/package.py --verify
      - name: Publish audited gateway release as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: gateway-esp32c3-audit
          path: |
            release/*.zip
            release/manifest.json
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
