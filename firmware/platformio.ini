; Open this firmware/ folder in VS Code with the PlatformIO IDE extension.
; Conventional PlatformIO src/ and include/ folders are used, consistent
; with the ESP32-S3 node firmware project.
; Midea Engineering: ESP32-C3 gateway reference build for PlatformIO in VS Code.
; The ESP32-S3 meter node uses a different board ID but exactly the same
; pioarduino release, RadioLib and ArduinoJson versions.
; Protocol v1 compatibility is verified by ../tools/check_compatibility.py.
[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
extra_scripts = post:../tools/pio_flash_guard.py
board_build.app_partition_name = factory
board_upload.maximum_size = 2097152
upload_protocol = esptool
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.flash_mode = qio
monitor_speed = 115200
upload_speed = 460800
build_unflags = -std=gnu++11
build_flags =
  -Iinclude/app
  -Iinclude/core
  -Iinclude/storage
  -Iinclude/web
  -std=gnu++17
  -D GATEWAY_BOARD_C3_DEVKITM
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D RADIOLIB_EXCLUDE_SX127X=1
  -D RADIOLIB_EXCLUDE_LR11X0=1
lib_deps =
  jgromes/RadioLib@7.8.1
  bblanchon/ArduinoJson@7.3.1
